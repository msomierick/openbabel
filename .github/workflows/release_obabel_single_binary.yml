name: Release obabel Single-Binary Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish assets to (example: v3.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact_name: obabel-linux
          - name: macos
            os: macos-latest
            artifact_name: obabel-macos
          - name: windows
            os: windows-latest
            artifact_name: obabel-windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get -qq update && sudo apt-get -qq install ninja-build libeigen3-dev libboost-all-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja eigen boost

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install MSVC Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build obabel standalone (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/release/build_obabel_standalone.sh
          scripts/release/build_obabel_standalone.sh

      - name: Build obabel standalone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/release/build_obabel_standalone.ps1

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/obabel-*

  publish:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve Tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "name=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum obabel-* > SHA256SUMS.txt

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --notes "Automated obabel standalone single-binary artifacts."
          fi
          gh release upload "${TAG_NAME}" release-assets/* --clobber
